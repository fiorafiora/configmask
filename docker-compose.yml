services:
  configmask:
    build: .
    ports:
      - "${CONFIGMASK_PORT:-8741}:8741"
    env_file:
      - .env
    environment:
      CONFIGMASK_DB_PATH: /data/configmask.db
      CONFIGMASK_PORT: "8741"
    volumes:
      - configmask-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8741/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  configmask-data:
