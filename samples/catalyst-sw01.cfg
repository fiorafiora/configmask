! Fake lab configuration. Northwind Analytics does not exist.
! Addresses are RFC1918 or documentation ranges only.
version 17.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
no service pad
!
hostname CSW-CEDAR-01
!
boot-start-marker
boot-end-marker
!
vrf definition CEDAR-MGMT
 rd 65001:30
 !
 address-family ipv4
 exit-address-family
!
enable secret 9 $9$FAKESECRET_SW_ENABLE9
enable password 7 FAKESECRET_SW_ENABLE7
!
username netops privilege 15 secret 9 $9$FAKESECRET_SW_NETOPS
username helpdesk privilege 1 password 7 FAKESECRET_SW_HELPDESK
username "bob smith" password 0 "FAKESECRET_SW_QUOTED"
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
!
ip domain name cedar.northwind.lab
ip name-server 192.0.2.53 198.51.100.53
!
ip routing
!
login on-success log
!
key chain OSPF-CEDAR
 key 1
  key-string 7 FAKESECRET_SW_KEYCHAIN
!
vlan 10
 name CEDAR-USERS
!
vlan 20
 name CEDAR-VOICE
!
vlan 30
 name CEDAR-MGMT
!
vlan 99
 name CEDAR-NATIVE
!
interface Port-channel1
 description Core bundle toward the Cedar distribution
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30
!
interface GigabitEthernet1/0/1
 description Cedar users access
 switchport access vlan 10
 switchport mode access
 switchport voice vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface GigabitEthernet1/0/24
 description Trunk toward ISR-CEDAR-01
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30
 switchport mode trunk
 channel-group 1 mode active
!
interface GigabitEthernet1/0/48
 description Maple fiber handoff
 switchport access vlan 30
 switchport mode access
!
interface Vlan10
 description Cedar user gateway
 ip address 192.168.10.2 255.255.255.0
 ip helper-address 192.168.10.10
 no ip redirects
 standby version 2
 standby 10 ip 192.168.10.254
 standby 10 priority 110
 standby 10 preempt
 standby 10 authentication md5 key-string 7 FAKESECRET_SW_HSRP
!
interface Vlan20
 description Cedar voice gateway
 ip address 192.168.20.2 255.255.255.0
 standby 20 ip 192.168.20.254
 standby 20 priority 110
 standby 20 preempt
 standby 20 authentication text FAKESECRET_SW_HSRP_TEXT
 vrrp 20 ip 192.168.20.253
 vrrp 20 authentication text FAKESECRET_SW_VRRP
!
interface Vlan30
 description Cedar management SVI
 vrf forwarding CEDAR-MGMT
 ip address 10.10.20.2 255.255.255.0
!
ip access-list extended CEDAR-MGMT-IN
 remark Allow Cedar operators to SSH
 permit tcp 10.10.20.0 0.0.0.255 any eq 22
 permit tcp 192.168.10.0 0.0.0.255 any eq 22
 deny ip any any log
!
ip route 0.0.0.0 0.0.0.0 10.10.20.1
ip default-gateway 10.10.20.1
!
snmp-server community FAKESECRET_SW_SNMP RO 10
snmp-server user snmpops SNMPGROUP v3 auth sha FAKESECRET_SW_SNMPAUTH priv aes 128 FAKESECRET_SW_SNMPPRIV
snmp-server location Cedar Lab closet A
snmp-server contact noc@cedar.northwind.lab
snmp-server chassis-id CSW-CEDAR-SN
snmp-server host 10.10.20.50 version 2c FAKESECRET_SW_SNMPHOST
snmp-server host 10.10.20.50 version 3 priv netops
!
ntp authenticate
ntp authentication-key 1 md5 FAKESECRET_SW_NTP 7
ntp trusted-key 1
ntp server 192.168.10.20
!
tacacs-server host 10.10.20.30 key 0 FAKESECRET_SW_TACACS
tacacs server TACACS-1
 address ipv4 10.10.20.30
 key 7 FAKESECRET_SW_TACACS_BLOCK
aaa group server tacacs+ NW-TACACS
 server name TACACS-1
!
dot11 ssid CEDAR-WIFI
 vlan 20
 authentication open
 authentication key-management wpa version 2
 wpa-psk ascii 0 FAKESECRET_SW_WPA
!
banner motd ^C
Northwind Analytics
Cedar Lab switch
Authorized engineers only.
^C
!
line con 0
 password 7 FAKESECRET_SW_CON
 logging synchronous
 login local
line vty 0 4
 password 0 FAKESECRET_SW_VTY
 access-class CEDAR-MGMT-IN in
 transport input ssh
 login authentication default
!
end
