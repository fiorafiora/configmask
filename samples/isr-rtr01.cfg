! Fake lab configuration. Northwind Analytics does not exist.
! Addresses are RFC1918 or documentation ranges only.
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname ISR-CEDAR-01
!
boot-start-marker
boot-end-marker
!
vrf definition CEDAR-GUEST
 rd 65001:10
 !
 address-family ipv4
 exit-address-family
!
enable algorithm-type scrypt secret FAKESECRET_R1_ENABLE_SCRYPT
enable secret level 15 0 FAKESECRET_R1_ENABLE_LEVEL
enable secret 5 $1$FAKESECRET_R1_ENABLE5
!
username netops privilege 15 secret 8 FAKESECRET_R1_NETOPS
username auditor privilege 1 password 0 FAKESECRET_R1_AUDITOR
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa accounting commands 15 default start-stop group tacacs+
!
ip domain name cedar.northwind.lab
ip name-server 192.0.2.53 198.51.100.53
ip cef
no ip bootp server
!
login on-success log
!
key chain OSPF-CEDAR
 key 1
  key-string 7 FAKESECRET_R1_KEYCHAIN
!
crypto isakmp policy 10
 encr aes 256
 hash sha256
 authentication pre-share
 group 14
crypto isakmp key FAKESECRET_R1_ISAKMP address 198.51.100.10
crypto isakmp key 6 FAKESECRET_R1_ISAKMP6 address 203.0.113.2
!
crypto keyring KR-CEDAR
 pre-shared-key address 198.51.100.10 key FAKESECRET_R1_PSK_ADDR
!
crypto ikev2 keyring IKEV2-CEDAR
 peer MAPLE
  address 203.0.113.2
  pre-shared-key local FAKESECRET_R1_PSK_LOCAL
  pre-shared-key remote FAKESECRET_R1_PSK_REMOTE
!
crypto ipsec transform-set TS-CEDAR esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto map CMAP-CEDAR 10 ipsec-isakmp
 set peer 198.51.100.10
 set transform-set TS-CEDAR
 match address CEDAR-VPN
!
crypto pki trustpoint TP-CEDAR
 enrollment selfsigned
 subject-name CN=ISR-CEDAR-01
 revocation-check none
!
crypto pki certificate chain TP-CEDAR
 certificate self-signed 01
  308203A1 30820289 A0030201 02020101 300D0609
  DEADBEEFDEADBEEF DEADBEEFDEADBEEF DEADBEEFDEADBEEF
  AA55AA55AA55AA55 AA55AA55AA55AA55
        quit
!
ip dhcp excluded-address 192.168.10.1 192.168.10.20
!
ip dhcp pool CEDAR-LAN
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.0.2.53
 domain-name cedar.northwind.lab
!
object-group network CEDAR-SERVERS
 host 192.168.10.10
 192.168.11.0 255.255.255.0
!
object-group service CEDAR-MGMT
 tcp eq 22
 tcp eq 443
!
ip access-list extended CEDAR-MGMT-IN
 remark Allow Cedar operators
 permit tcp 10.10.20.0 0.0.0.255 any eq 22
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.10.1 eq 22
 deny ip any any
!
ip access-list extended CEDAR-VPN
 permit ip 192.168.10.0 0.0.0.255 192.168.40.0 0.0.0.255
 permit ip 10.1.5.0 0.0.0.255 10.2.5.0 0.0.0.255
!
ip access-list extended CEDAR-NAT
 deny ip 192.168.10.0 0.0.0.255 192.168.40.0 0.0.0.255
 permit ip 192.168.10.0 0.0.0.255 any
!
access-list 10 permit 192.168.10.0 0.0.0.255
access-list 101 permit ip any host 224.0.0.5
access-list 101 permit ip any host 224.0.0.6
access-list 101 permit ip any host 224.0.0.10
access-list 101 permit ip host 127.0.0.1 any
access-list 101 deny ip any host 255.255.255.255
!
ip prefix-list CEDAR-OUT seq 5 permit 192.168.10.0/24
ip prefix-list CEDAR-OUT seq 10 permit 10.1.5.0/24
ip prefix-list DEFAULT seq 5 permit 0.0.0.0/0
!
route-map CEDAR-OUT permit 10
 match ip address prefix-list CEDAR-OUT
 set ip next-hop 203.0.113.2
!
interface Loopback0
 description Cedar router id
 ip address 10.1.5.1 255.255.255.0
 ip ospf 1 area 0
!
interface Tunnel0
 description Cedar to Maple
 ip address 10.255.0.1 255.255.255.252
 ip mtu 1400
 tunnel source GigabitEthernet0/0/0
 tunnel destination 203.0.113.2
 tunnel key FAKESECRET_R1_TUNNEL
 tunnel protection ipsec profile IKEV2-CEDAR
!
interface GigabitEthernet0/0/0
 description WAN to Maple
 ip address 203.0.113.1 255.255.255.252
 ip nat outside
 ip access-group CEDAR-MGMT-IN in
 crypto map CMAP-CEDAR
!
interface GigabitEthernet0/0/1
 description Cedar users
 ip address 192.168.10.1 255.255.255.0
 ip address 192.168.11.1 255.255.255.0 secondary
 ip nat inside
 ip helper-address 192.168.10.10
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 7 FAKESECRET_R1_OSPF_MD5
 ip ospf authentication-key FAKESECRET_R1_OSPF_AUTH
 ip ospf 1 area 0
 standby 10 ip 192.168.10.254
 standby 10 priority 90
 standby 10 authentication md5 key-string 7 FAKESECRET_R1_HSRP
!
interface Dialer1
 description Cedar backup
 ip address negotiated
 encapsulation ppp
 ppp chap hostname ISR-CEDAR-01
 ppp chap password 0 FAKESECRET_R1_PPP_CHAP
 ppp pap sent-username netops password 0 FAKESECRET_R1_PPP_PAP
!
router ospf 1
 router-id 10.1.5.1
 passive-interface default
 no passive-interface GigabitEthernet0/0/1
 network 192.168.10.0 0.0.0.255 area 0
 network 10.1.5.0 0.0.0.255 area 0
!
router eigrp 100
 network 10.255.0.0 0.0.0.3
 network 192.168.11.0 0.0.0.255
!
router bgp 65001
 bgp router-id 10.1.5.1
 bgp log-neighbor-changes
 neighbor 203.0.113.2 remote-as 65002
 neighbor 203.0.113.2 password 7 FAKESECRET_R1_BGP
 neighbor 198.51.100.10 remote-as 65010
 neighbor 198.51.100.10 description documentation peer
 address-family ipv4
  network 192.168.10.0 mask 255.255.255.0
  network 10.1.5.0 mask 255.255.255.0
  neighbor 203.0.113.2 activate
  neighbor 203.0.113.2 route-map CEDAR-OUT out
  neighbor 198.51.100.10 activate
 exit-address-family
!
ip nat inside source list CEDAR-NAT interface GigabitEthernet0/0/0 overload
ip nat inside source static 192.168.10.10 203.0.113.10
ip route 0.0.0.0 0.0.0.0 203.0.113.2
ip route 172.16.50.0 255.255.255.0 192.168.10.254
ip ftp username netops
ip ftp password 0 FAKESECRET_R1_FTP
ip http client password FAKESECRET_R1_HTTP
!
logging host 192.168.10.40
!
snmp-server community FAKESECRET_R1_SNMP RO 10
snmp-server location Cedar Lab rack 4
snmp-server contact noc@cedar.northwind.lab
snmp-server host 10.10.20.50 version 2c FAKESECRET_R1_SNMPHOST
!
ntp authentication-key 1 md5 FAKESECRET_R1_NTP 7
ntp trusted-key 1
ntp server 192.168.10.20
!
tacacs-server key 7 FAKESECRET_R1_TACACS_KEY
tacacs-server host 10.10.20.30 key 0 FAKESECRET_R1_TACACS_HOST
radius-server key FAKESECRET_R1_RADIUS_KEY
radius-server host 10.10.20.31 auth-port 1812 acct-port 1813 key 7 FAKESECRET_R1_RADIUS_HOST
tacacs server TACACS-1
 address ipv4 10.10.20.30
 key 7 FAKESECRET_R1_TACACS_BLOCK
radius server RADIUS-1
 address ipv4 10.10.20.31 auth-port 1812 acct-port 1813
 key FAKESECRET_R1_RADIUS_BLOCK
aaa group server tacacs+ NW-TACACS
 server-private 10.10.20.30 key 0 FAKESECRET_R1_SERVER_PRIVATE
aaa server radius dynamic-author
 client 10.10.20.31 server-key FAKESECRET_R1_SERVER_KEY
!
key config-key password-encrypt FAKESECRET_R1_MASTER
!
banner login ^C
Northwind Analytics
Cedar Lab router
Disconnect if you are not an authorized engineer.
^C
!
line con 0
 password 7 FAKESECRET_R1_CON
 logging synchronous
 login local
line vty 0 4
 password 0 FAKESECRET_R1_VTY
 transport input ssh
 login authentication default
!
end
