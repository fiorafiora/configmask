! Fake lab configuration. Northwind Analytics does not exist.
! Peer of isr-rtr01. Shared addresses must keep one stand-in in the session.
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname ISR-MAPLE-01
!
enable secret 9 $9$FAKESECRET_R2_ENABLE9
!
username netops privilege 15 secret 9 $9$FAKESECRET_R2_NETOPS
!
aaa new-model
aaa authentication login default group tacacs+ local
!
ip domain name maple.northwind.lab
ip name-server 192.0.2.53
ip cef
!
key chain OSPF-MAPLE
 key 1
  key-string 7 FAKESECRET_R2_KEYCHAIN
!
crypto isakmp policy 10
 encr aes 256
 authentication pre-share
 group 14
crypto isakmp key FAKESECRET_R2_ISAKMP address 203.0.113.1
!
crypto map CMAP-MAPLE 10 ipsec-isakmp
 set peer 203.0.113.1
 set peer 198.51.100.10
!
interface Loopback0
 description Maple router id
 ip address 10.2.5.1 255.255.255.0
!
interface Tunnel0
 description Maple to Cedar
 ip address 10.255.0.2 255.255.255.252
 tunnel source GigabitEthernet0/0/0
 tunnel destination 203.0.113.1
 tunnel key FAKESECRET_R2_TUNNEL
!
interface GigabitEthernet0/0/0
 description WAN to Cedar
 ip address 203.0.113.2 255.255.255.252
 crypto map CMAP-MAPLE
!
interface GigabitEthernet0/0/1
 description Maple users
 ip address 192.168.40.1 255.255.255.0
 standby 40 ip 192.168.40.254
 standby 40 authentication text FAKESECRET_R2_HSRP
!
router ospf 1
 router-id 10.2.5.1
 network 192.168.40.0 0.0.0.255 area 0
 network 10.2.5.0 0.0.0.255 area 0
!
router bgp 65002
 bgp router-id 10.2.5.1
 neighbor 203.0.113.1 remote-as 65001
 neighbor 203.0.113.1 password 0 FAKESECRET_R2_BGP
 neighbor 10.255.0.1 remote-as 65001
 neighbor 198.51.100.10 remote-as 65010
 address-family ipv4
  network 192.168.40.0 mask 255.255.255.0
  neighbor 203.0.113.1 activate
  neighbor 10.255.0.1 activate
  neighbor 198.51.100.10 activate
 exit-address-family
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
ip route 192.168.10.0 255.255.255.0 10.255.0.1
!
ip access-list extended MAPLE-MGMT-IN
 remark Allow Maple operators
 permit tcp 10.10.20.0 0.0.0.255 host 192.168.40.1 eq 22
 deny ip any any
!
logging host 10.10.20.40
ntp server 192.168.10.20
snmp-server host 10.10.20.50 version 2c FAKESECRET_R2_SNMPHOST
snmp-server location Maple Lab rack 2
snmp-server contact noc@maple.northwind.lab
!
tacacs server TACACS-1
 address ipv4 10.10.20.30
 key 0 FAKESECRET_R2_TACACS
!
banner motd ^C
Northwind Analytics
Maple Lab router
^C
!
line con 0
 password 7 FAKESECRET_R2_CON
 login local
line vty 0 4
 access-class MAPLE-MGMT-IN in
 password 0 FAKESECRET_R2_VTY
 transport input ssh
!
end
